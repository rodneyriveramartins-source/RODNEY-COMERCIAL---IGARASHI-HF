<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap');

  :root {
    --dark: #051F20;
    --mid: #8EB69B;
    --light: #DAF1DE;
    --gold: #D9C988;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: linear-gradient(180deg, var(--dark) 0%, #0A2E2F 100%);
    color: var(--light);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }

  .card { max-width: 340px; width: 100%; }

  .logo-chip {
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
    border-radius: 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }

  h1 {
    font-size: 24px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: .3px;
  }

  p.sub {
    font-size: 13px;
    color: var(--mid);
    margin: 4px 0 22px;
  }

  a.go {
    display: block;
    background: var(--gold);
    color: var(--dark);
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 18px;
    border-radius: 999px;
    transition: transform .1s ease;
  }

  a.go:active { transform: scale(0.97); }

  p.note {
    font-size: 12px;
    color: var(--mid);
    opacity: .8;
    margin-top: 14px;
  }

  footer {
    font-size: 11px;
    color: var(--mid);
    opacity: .6;
    margin-top: 28px;
  }
</style>
</head>
